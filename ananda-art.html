<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casih & Asociados — Ananda: aptos para ART</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0C;--bg2:#131316;--bg3:#1A1A1F;--border:#26262C;--border2:#34343C;--text:#fff;--text2:#B8B8C0;--text3:#7C7C88;--green:#3DD68C;--red:#E85D5D;--blue:#5B9BF0;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
  body{padding:24px 16px 120px;max-width:640px;margin:0 auto;}
  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:26px;margin:0 0 4px;}
  .sub{font-size:14px;color:var(--text3);margin-bottom:20px;line-height:1.4;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
  input.fi{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:12px;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:14px;font-size:16px;font-weight:600;}
  .btn:disabled{opacity:.5;cursor:default;}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px;}
  .row{display:block;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .row.si{border-color:var(--green);} .row.no{border-color:var(--red);}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  textarea.ob{width:100%;margin-top:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px;color:var(--text);font-family:inherit;font-size:14px;min-height:44px;resize:vertical;}
  .nm{font-size:15px;font-weight:500;flex:1;min-width:0;} .nm small{display:block;color:var(--text3);font-weight:400;font-size:12px;}
  .sn{display:flex;gap:6px;flex-shrink:0;}
  .sn button{width:64px;padding:10px 0;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:15px;font-weight:600;}
  .sn button.on-si{background:var(--green);border-color:var(--green);color:#06220f;}
  .sn button.on-no{background:var(--red);border-color:var(--red);color:#fff;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,12,.96);border-top:1px solid var(--border);padding:12px 16px;}
  .bar>div{max-width:640px;margin:0 auto;}
  .cnt{font-size:13px;color:var(--text2);margin-bottom:8px;text-align:center;}
  .ok{text-align:center;padding:30px 10px;} .ok b{color:var(--green);font-size:20px;}
  .salir{background:none;border:none;color:var(--text3);font-size:12px;text-decoration:underline;float:right;}
</style>
</head>
<body>
<div id="login">
  <h1>Casih & Asociados</h1>
  <div class="sub">Ingresá con el mismo mail y contraseña del Sistema.</div>
  <div class="card">
    <input class="fi" id="em" type="email" placeholder="Email" autocomplete="username">
    <input class="fi" id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="btn-login">Entrar</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app" style="display:none">
  <button class="salir" id="btn-salir">Salir</button>
  <h1>Clientes Ananda</h1>
  <div class="sub">Marcá <b>Sí</b> si el cliente está apto para ART (enfermedad profesional) o <b>No</b> si no. Al tocar <b>Enviar</b>, los que dijiste Sí pasan solos al seguimiento de Ananda por enfermedad profesional.</div>
  <input class="fi" id="buscar" placeholder="Buscar por nombre…">
  <div id="lista"></div>
  <div class="bar"><div>
    <div class="cnt" id="cnt"></div>
    <button class="btn" id="btn-enviar" disabled>Enviar</button>
  </div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAJgmhuG2v6Bnun37mgqLUA0f0KLdcnvY8",
  authDomain:"sistemacasih.firebaseapp.com",
  projectId:"sistemacasih",
  storageBucket:"sistemacasih.firebasestorage.app",
  messagingSenderId:"1052384245593",
  appId:"1:1052384245593:web:404c936023498e60ef3e48"
});
var auth=firebase.auth(),db=firebase.firestore();
var PASOS=['Cita médica','El cliente se realiza los estudios','Visita al médico para el certificado'];
var CLIENTES=[],RESP={},OBS={},unsub=null,TODOS=[];
// Clientes que están en las carpetas de Drive pero todavía no cargados en el Sistema.
// Si ya existen en la carpeta Ananda del Sistema, no se muestran de nuevo.
var EXTRAS=[
  {id:'x1',nombre:'Ricardo',apellido:'Peralta',extra:true},
  {id:'x2',nombre:'Alexis',apellido:'Carranza',extra:true},
  {id:'x3',nombre:'Eduardo Raúl',apellido:'Lopez',extra:true},
  {id:'x4',nombre:'Kevin Thomas',apellido:'Valdez',extra:true}
];
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function nombreCompleto(c){return c.extra?(c.apellido?c.nombre+' '+c.apellido:c.nombre):(c.nombre||'');}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hoy(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

$('btn-login').onclick=function(){
  $('login-err').textContent='';
  auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(function(){$('login-err').textContent='Email o contraseña incorrectos.';});
};
$('pw').onkeydown=function(e){if(e.key==='Enter')$('btn-login').click();};
$('btn-salir').onclick=function(){auth.signOut();};

auth.onAuthStateChanged(function(u){
  $('login').style.display=u?'none':'block';
  $('app').style.display=u?'block':'none';
  if(unsub){unsub();unsub=null;}
  if(!u)return;
  unsub=db.collection('clientes').onSnapshot(function(snap){
    CLIENTES=[];TODOS=[];
    snap.forEach(function(d){
      var c=d.data();c.id=d.id;
      // Ananda, activo (no en revisión) y que todavía no esté en ningún seguimiento
      TODOS.push(c);
      if(c.tipo==='ananda'&&c.enRevision!==true&&c.aptoArt!==false&&!(c.checklist&&c.checklist.length))CLIENTES.push(c);
    });
    EXTRAS.forEach(function(e){
      var n=norm(nombreCompleto(e));
      var yaEsta=TODOS.some(function(c){return c.tipo==='ananda'&&norm(c.nombre)===n;});
      if(!yaEsta)CLIENTES.push(e);
    });
    CLIENTES.sort(function(a,b){return nombreCompleto(a).localeCompare(nombreCompleto(b),'es');});
    render();
  },function(){$('lista').innerHTML='<div class="err">No se pudo cargar la lista. Revisá tu conexión.</div>';});
});

function render(){
  var q=$('buscar').value.trim().toLowerCase();
  var l=CLIENTES.filter(function(c){return !q||nombreCompleto(c).toLowerCase().indexOf(q)>-1;});
  $('lista').innerHTML=l.length?l.map(function(c){
    var r=RESP[c.id];
    return '<div class="row'+(r==='si'?' si':r==='no'?' no':'')+'"><div class="top"><div class="nm">'+esc(nombreCompleto(c)||'(sin nombre)')+(c.tel?'<small>'+esc(c.tel)+'</small>':'')+'</div>'+
      '<div class="sn"><button class="'+(r==='si'?'on-si':'')+'" onclick="marcar(\''+c.id+'\',\'si\')">Sí</button>'+
      '<button class="'+(r==='no'?'on-no':'')+'" onclick="marcar(\''+c.id+'\',\'no\')">No</button></div></div>'+
      '<textarea class="ob" placeholder="Observaciones (opcional)" oninput="OBS[\''+c.id+'\']=this.value">'+esc(OBS[c.id]||'')+'</textarea></div>';
  }).join(''):'<div class="sub">No hay clientes de Ananda pendientes de revisar.</div>';
  var n=Object.keys(RESP).filter(function(k){return CLIENTES.some(function(c){return c.id===k;});});
  var si=n.filter(function(k){return RESP[k]==='si';}).length;
  $('cnt').textContent=n.length?('Marcados: '+n.length+' de '+CLIENTES.length+' · Sí: '+si+' · No: '+(n.length-si)):('Clientes sin responder: '+CLIENTES.length);
  $('btn-enviar').disabled=!n.length;
}
function marcar(id,v){RESP[id]=(RESP[id]===v)?undefined:v;if(RESP[id]===undefined)delete RESP[id];render();}
$('buscar').oninput=render;

$('btn-enviar').onclick=function(){
  var ids=Object.keys(RESP).filter(function(k){return CLIENTES.some(function(c){return c.id===k;});});
  var si=ids.filter(function(k){return RESP[k]==='si';}),no=ids.length-si.length;
  if(!confirm('Vas a enviar '+ids.length+' respuestas:\n• '+si.length+' Sí (pasan al seguimiento por enfermedad profesional)\n• '+no+' No\n\n¿Enviar?'))return;
  $('btn-enviar').disabled=true;$('btn-enviar').textContent='Enviando…';
  var b=db.batch();
  ids.forEach(function(id){
    var cl=CLIENTES.find(function(c){return c.id===id;});
    if(cl&&cl.extra){
      // Cliente nuevo: se crea en la carpeta Ananda del Sistema
      var nuevo={nombre:nombreCompleto(cl),apellido:cl.apellido||'',dni:'',edad:'',cuil:'',tel:'',email:'',domicilio:'',ciudad:'',empleador:'',notas:'',
        tipo:'ananda',enRevision:false,expte:'',etapa:'Cita',fecha:hoy(),drive:'',driveFolderId:'',
        creadoEn:firebase.firestore.FieldValue.serverTimestamp(),aptoArt:RESP[id]==='si'};
      var ob=(OBS[id]||'').trim();if(ob){nuevo.obsArt=ob;nuevo.notas='Observaciones ART: '+ob;}
      if(RESP[id]==='si'){nuevo.checklistTipo='enfermedad';nuevo.checklist=PASOS.map(function(t){return {t:t,h:false,f:'',p:''};});nuevo.checklistActualizado=hoy();}
      b.set(db.collection('clientes').doc(),nuevo);
      return;
    }
    var ref=db.collection('clientes').doc(id);
    var ob=(OBS[id]||'').trim();
    var extraObs=ob?{obsArt:ob,notas:((cl&&cl.notas)?cl.notas+'\n':'')+'Observaciones ART: '+ob}:{};
    if(RESP[id]==='si'){
      b.update(ref,Object.assign({aptoArt:true,checklistTipo:'enfermedad',
        checklist:PASOS.map(function(t){return {t:t,h:false,f:'',p:''};}),
        checklistActualizado:hoy()},extraObs));
    }else{
      b.update(ref,Object.assign({aptoArt:false},extraObs));
    }
  });
  b.commit().then(function(){
    RESP={};OBS={};
    $('lista').innerHTML='<div class="ok"><b>✓ Enviado</b><div class="sub" style="margin-top:8px">Los que marcaste Sí ya están en el seguimiento de Ananda por enfermedad profesional.</div></div>';
    $('btn-enviar').textContent='Enviar';
    setTimeout(render,2500);
  }).catch(function(){
    alert('No se pudo enviar. Probá de nuevo.');
    $('btn-enviar').textContent='Enviar';render();
  });
};
</script>
</body>
</html>
